---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow"><a href="{{ '/writing/' | relative_url }}">Writing</a></p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.updated %}<span>Updated {{ page.updated | date: "%B %-d, %Y" }}</span>{% endif %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
