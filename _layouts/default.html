---
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f7f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151618" media="(prefers-color-scheme: dark)">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">Mark Hare<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </header>

    <main id="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ 'now' | date: '%Y' }} Mark Hare</p>
      <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </footer>
  </body>
</html>
